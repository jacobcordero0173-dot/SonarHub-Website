<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SonarHub</title>
    <!-- Firebase SDKs (compat version for easy use) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        /* (Same black/purple/white CSS as before – keep it) */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg:#0a0a0a; --surface:#121212; --purple:#a855f7; --purple-glow:rgba(168,85,247,0.35);
            --purple-light:#c084fc; --white:#ffffff; --text:#e0e0e0; --muted:#999; --border:#2a2a2a;
            --font-head:'Impact','Arial Black',sans-serif; --font-body:'Segoe UI',system-ui,sans-serif;
        }
        body {
            font-family:var(--font-body); background:var(--bg); color:var(--text);
            min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
        }
        body::before {
            content:''; position:fixed; top:-30%; left:50%; transform:translateX(-50%);
            width:600px; height:600px; background:radial-gradient(circle,rgba(168,85,247,0.1) 0%,transparent 70%);
            pointer-events:none; z-index:0;
        }
        .signup-container {
            position:relative; z-index:1; width:100%; max-width:420px; background:var(--surface);
            border:1px solid #222; border-radius:16px; padding:40px 32px; box-shadow:0 0 50px rgba(168,85,247,0.1);
        }
        .top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
        .back-home { color:var(--muted); text-decoration:none; font-size:0.85rem; transition:color 0.2s; }
        .back-home:hover { color:var(--purple-light); }
        .logo-small { font-family:var(--font-head); font-size:1.3rem; letter-spacing:2px; color:var(--white); text-shadow:0 0 10px var(--purple); text-decoration:none; }
        .logo-small span { color:var(--purple-light); }
        .signup-container h1 { font-family:var(--font-head); font-size:1.8rem; letter-spacing:1px; color:var(--white); margin-bottom:24px; text-align:center; }
        .social-buttons { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
        #googleSignUp { display:flex; justify-content:center; }
        .social-btn {
            display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
            padding:12px 16px; border-radius:6px; font-weight:600; font-size:0.9rem; letter-spacing:0.5px;
            cursor:pointer; text-decoration:none; border:1px solid #333; background:transparent; color:var(--white);
            transition:all 0.25s ease; font-family:var(--font-body);
        }
        .social-btn:hover { border-color:var(--purple); background:rgba(168,85,247,0.08); box-shadow:0 0 18px rgba(168,85,247,0.15); }
        .social-btn svg { width:20px; height:20px; }
        .divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:#666; font-size:0.8rem; letter-spacing:1px; }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:#2a2a2a; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:0.8rem; font-weight:600; letter-spacing:1px; color:#bbb; margin-bottom:6px; text-transform:uppercase; }
        .form-group input {
            width:100%; padding:12px 14px; border-radius:6px; border:1px solid #333; background:#1a1a1a;
            color:var(--white); font-size:0.95rem; font-family:var(--font-body); transition:border-color 0.25s, box-shadow 0.25s; outline:none;
        }
        .form-group input:focus { border-color:var(--purple); box-shadow:0 0 12px rgba(168,85,247,0.2); }
        .form-group input::placeholder { color:#555; }
        .submit-btn {
            width:100%; padding:13px; border-radius:6px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
            font-size:0.85rem; cursor:pointer; border:none; background:var(--purple); color:#000;
            transition:all 0.3s ease; margin-top:4px; font-family:var(--font-body);
        }
        .submit-btn:hover { background:var(--purple-light); box-shadow:0 0 30px var(--purple-glow); transform:translateY(-2px); }
        .login-link { text-align:center; margin-top:20px; font-size:0.85rem; color:#888; }
        .login-link a { color:var(--purple-light); text-decoration:none; font-weight:600; transition:color 0.2s; }
        .login-link a:hover { color:var(--white); text-decoration:underline; }
        #profileSection { display:none; }
        #profileSection h2 { font-family:var(--font-head); font-size:1.5rem; color:var(--white); margin-bottom:20px; text-align:center; }
        .success-message { text-align:center; color:var(--purple-light); font-weight:600; margin-top:20px; }
        @media (max-width:480px) {
            .signup-container { padding:28px 20px; border-radius:12px; }
            .signup-container h1 { font-size:1.5rem; }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="top-row">
            <a href="index.html" class="back-home">&#8592; Back</a>
            <a href="index.html" class="logo-small">SONAR<span>HUB</span></a>
        </div>

        <!-- Initial view -->
        <div id="initialView">
            <h1>Create your account</h1>

            <div class="social-buttons">
                <div id="googleSignUp"></div>
                <button class="social-btn" onclick="alert('GitHub sign-up (demo)')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    Sign up with GitHub
                </button>
                <button class="social-btn" onclick="alert('Apple sign-up (demo)')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                    Sign up with Apple
                </button>
            </div>

            <div class="divider">Or</div>

            <form id="emailSignupForm" onsubmit="handleEmailSignUp(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email address" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required minlength="6">
                </div>
                <button type="submit" class="submit-btn">Sign Up</button>
            </form>

            <p class="login-link">Already have a SonarHub account? <a href="#">Log in</a></p>
        </div>

        <!-- Profile completion view -->
        <div id="profileSection">
            <h2>Complete your profile</h2>
            <form id="profileForm" onsubmit="handleProfileSubmit(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="displayName">Display Name</label>
                    <input type="text" id="displayName" placeholder="How should we call you?" required>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
            <div id="profileMessage" class="success-message"></div>
        </div>
    </div>

    <!-- Google Identity Services (still used for Google button) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        // ===== 🔁 REPLACE WITH YOUR FIREBASE CONFIG =====
  const firebaseConfig = {
    apiKey: "AIzaSyAiA2GsMrApSozoEFuemjOdTD7sGXwW2ts",
    authDomain: "sonarhub-285f3.firebaseapp.com",
    projectId: "sonarhub-285f3",
    storageBucket: "sonarhub-285f3.firebasestorage.app",
    messagingSenderId: "892580357608",
    appId: "1:892580357608:web:87a7fd438c0941643d705d",
    measurementId: "G-TSS5J8K2P5"
  };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Google OAuth client ID (same as before)
        const GOOGLE_CLIENT_ID = '875038248833-4emtqbs5ouvefcd95pph7fec0u4q6d8r.apps.googleusercontent.com';

        // Store Firebase user temporarily while completing profile
        let currentFirebaseUser = null;

        // ----- Google Sign-In (unchanged, but now creates Firebase user) -----
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleResponse,
            });
            google.accounts.id.renderButton(
                document.getElementById('googleSignUp'),
                { type: 'standard', theme: 'filled_black', size: 'large', text: 'signup_with', shape: 'rectangular', logo_alignment: 'left', width: '100%' }
            );
        };

        function handleGoogleResponse(response) {
            const idToken = response.credential;
            // Use Firebase to sign in with Google credential
            const credential = firebase.auth.GoogleAuthProvider.credential(idToken);
            auth.signInWithCredential(credential)
                .then((result) => {
                    const user = result.user;
                    // Check if profile exists in Firestore
                    db.collection("users").doc(user.uid).get().then(doc => {
                        if (doc.exists) {
                            // Already signed up – go to home
                            window.location.href = 'index.html';
                        } else {
                            // New user – ask for profile
                            currentFirebaseUser = user;
                            document.getElementById('initialView').style.display = 'none';
                            document.getElementById('profileSection').style.display = 'block';
                        }
                    });
                })
                .catch(error => {
                    alert('Google sign-in failed: ' + error.message);
                });
        }

        // ----- Email/Password Sign-Up (now creates Firebase user) -----
        function handleEmailSignUp(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    currentFirebaseUser = userCredential.user;
                    // Show profile completion
                    document.getElementById('initialView').style.display = 'none';
                    document.getElementById('profileSection').style.display = 'block';
                })
                .catch(error => {
                    if (error.code === 'auth/email-already-in-use') {
                        alert('This email is already registered. Please log in.');
                    } else {
                        alert('Sign-up error: ' + error.message);
                    }
                });
        }

        // ----- Profile Completion (saves to Firestore) -----
        function handleProfileSubmit(event) {
            event.preventDefault();
            if (!currentFirebaseUser) {
                alert('No user found. Please start again.');
                return;
            }

            const username = document.getElementById('username').value.trim();
            const displayName = document.getElementById('displayName').value.trim();
            if (!username || !displayName) return;

            // Save profile data to Firestore
            const userProfile = {
                uid: currentFirebaseUser.uid,
                email: currentFirebaseUser.email,
                displayName: displayName,
                username: username,
                photoURL: currentFirebaseUser.photoURL || '',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                signupMethod: currentFirebaseUser.providerData[0]?.providerId || 'email'
            };

            db.collection("users").doc(currentFirebaseUser.uid).set(userProfile)
                .then(() => {
                    document.getElementById('profileForm').style.display = 'none';
                    const msg = document.getElementById('profileMessage');
                    msg.textContent = `Account created! Welcome, ${displayName}! Redirecting...`;
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                })
                .catch(error => {
                    alert('Failed to save profile: ' + error.message);
                });
        }
    </script>
</body>
</html>
